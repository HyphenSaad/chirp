# =============================================================================
# Builds and deploys the Chirp documentation site to GitHub Pages.
#
# Triggers on every push to main. Two artifacts get combined into the
# deployed site:
#
#   1. The hand-written docs in docs/  (Markdown, rendered to HTML by Jekyll)
#   2. The Javadoc built from src/main/java/  (HTML, dropped into docs/javadoc/)
#
# Nothing is committed back to the repository. The generated Javadoc lives
# only in the runner workspace and in the Pages artifact — so the repo stays
# clean and the site always matches the source code at the current commit.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:                    # allow manual trigger from the Actions tab

# Required permissions for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; new pushes wait for the current build
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Javadoc
        # Produces target/site/apidocs/ — the full Javadoc HTML tree.
        # doclint=none and quiet=true are already set in pom.xml, so this
        # never fails on missing @param / @return tags.
        run: mvn -B -ntp javadoc:javadoc

      - name: Copy Javadoc into docs
        # Jekyll serves docs/ as the site root. Adding the Javadoc here means
        # it lives at /javadoc/ on the deployed site.
        run: |
          mkdir -p docs/javadoc
          cp -r target/site/apidocs/* docs/javadoc/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        # The artifact IS the deployed site. Whatever is inside docs/ at this
        # point — markdown + javadoc + any static assets — becomes the site.
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4