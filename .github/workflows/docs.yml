# =============================================================================
# Builds and deploys the Chirp documentation site to GitHub Pages.
#
# Three things are combined into the deployed site:
#
#   1. The hand-written docs in docs/  (Markdown → rendered to HTML by Jekyll)
#   2. The Javadoc built from src/main/java/  (copied into docs/javadoc/)
#   3. The rendered Jekyll site  (_site/) → uploaded as the Pages artifact
#
# GitHub Pages requires index.html at the TOP of the deployed artifact —
# it does NOT look for index.md. So Jekyll must render the markdown before
# upload; otherwise /chirp/ 404s even though /chirp/javadoc/ works.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ---- 1. Build Javadoc into target/site/apidocs/ ----------------------
      - name: Build Javadoc
        run: mvn -B -ntp javadoc:javadoc

      # ---- 2. Move Javadoc into the Jekyll source tree ----------------------
      - name: Copy Javadoc into docs
        run: |
          mkdir -p docs/javadoc
          cp -r target/site/apidocs/* docs/javadoc/

      # ---- 3. Render docs/ (markdown + javadoc) into _site/ ----------------
      # This is the step that was missing. It converts docs/index.md →
      # _site/index.html, docs/QUICKSTART.md → _site/QUICKSTART.html, etc.,
      # and copies docs/javadoc/ through unchanged (HTML is already HTML).
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          future: false

      # ---- 4. Publish _site/ as the Pages artifact -------------------------
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # ---- 5. Deploy to the Pages CDN --------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4